# =============================================================================
# Sushruta — Alembic Configuration
# =============================================================================
#
# This is the Alembic config file.  It is read by alembic/env.py at runtime.
#
# IMPORTANT: The sqlalchemy.url below is a PLACEHOLDER.  The actual database
# URL is loaded dynamically in alembic/env.py from app.config.get_settings()
# so that credentials are never hard-coded in version control.
# =============================================================================

[alembic]

# ---- Script location --------------------------------------------------------
# Path to the directory containing env.py, script.py.mako, and the versions/
# sub-directory where individual migration scripts are stored.
# -----------------------------------------------------------------------------
script_location = alembic

# ---- Migration file template ------------------------------------------------
# Uncomment to use a custom Mako template for generated migration scripts.
# file_template = %%(rev)s_%%(slug)s
# -----------------------------------------------------------------------------

# ---- Timezone ----------------------------------------------------------------
# Set to 'true' to use UTC timestamps in migration filenames.
# timezone =
# -----------------------------------------------------------------------------

# ---- Truncate slug length ----------------------------------------------------
# Limit the "slug" portion of migration filenames.  0 = no limit.
# truncate_slug_length = 40
# -----------------------------------------------------------------------------

# ---- Revision environment variable -------------------------------------------
# Allows overriding the revision argument via an environment variable.
# set to 'true' to enable
# revision_environment = false
# -----------------------------------------------------------------------------

# ---- SQLAlchemy URL (placeholder — overridden in env.py) ---------------------
# This value is required by Alembic's config parser, but env.py replaces it
# with the real async DATABASE_URL from the application settings.
# DO NOT put real credentials here.
# -----------------------------------------------------------------------------
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/sushruta

# ---- Prepend sys.path -------------------------------------------------------
# Ensures the project root is on sys.path so that `from app.config import ...`
# works when running alembic commands from the project root.
# -----------------------------------------------------------------------------
prepend_sys_path = .

# ---- Version path separator --------------------------------------------------
# Use "os" for OS-specific path separator, or provide a specific separator.
# version_path_separator = os  # default: use os.pathsep
# -----------------------------------------------------------------------------

# =============================================================================
# Logging configuration
# =============================================================================
# Standard Python logging setup.  Alembic emits migration progress messages
# through the "alembic" logger.  SQLAlchemy engine logs are available via the
# "sqlalchemy.engine" logger (set to WARN to reduce noise).
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# ---- Root logger -------------------------------------------------------------
[logger_root]
level = WARN
handlers = console
qualname =

# ---- SQLAlchemy engine logger ------------------------------------------------
# Set to INFO to see all SQL statements, or DEBUG for parameter values.
# WARNING: DEBUG level may log sensitive data — never use in production.
# -----------------------------------------------------------------------------
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# ---- Alembic logger ---------------------------------------------------------
# INFO level shows migration progress (upgrade/downgrade steps).
# -----------------------------------------------------------------------------
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# ---- Console handler ---------------------------------------------------------
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# ---- Generic formatter -------------------------------------------------------
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
